services:
  - type: web
    name: mncjg-ngboost-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGIN
        value: https://wxiaobei87.github.io
      - key: MODEL_B64_PATHS
        value: /etc/secrets/NGBoost_model_part1.txt,/etc/secrets/NGBoost_model_part2.txt
